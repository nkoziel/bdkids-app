function searchCatalog(term) {
  const q = term.trim().toLowerCase();
  if (!q) return [];
  return catalog.filter((s) => s.name.toLowerCase().includes(q)).slice(0, 8);
}
function catalogSeries(id) {
  return catalog.find((s) => s.id === id) || null;
}
function catalogTomes(id) {
  const s = catalogSeries(id);
  if (!s) return [];
  return s.tomes.filter((t) => t.num > 0).sort((a, b) => a.num - b.num);
}
function openAdd() {
  const host = $("modalHost");
  host.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <button class="close" aria-label="Fermer">&times;</button>
        <h2>Nouvelle serie</h2>
        <label class="field">
          Chercher dans le catalogue
          <input type="text" id="catalogSearch" placeholder="Ariol, Brume..." autofocus />
        </label>
        <div id="catalogResults"></div>
        <details id="manualDetails">
          <summary>Ajouter manuellement (serie absente du catalogue)</summary>
          <label class="field">
            Titre
            <input type="text" id="addTitle" />
          </label>
          <label class="field">
            Auteur (optionnel)
            <input type="text" id="addAuthor" />
          </label>
          <label class="field">
            Editeur (optionnel)
            <input type="text" id="addPublisher" />
          </label>
          <label class="field">
            Nombre de tomes publies (si connu)
            <input type="number" min="0" id="addTotal" placeholder="?" />
          </label>
          <div class="sheet-actions">
            <button id="addConfirm">Ajouter</button>
          </div>
        </details>
      </div>
    </div>`;
  host.querySelector(".close").addEventListener("click", closeModal);
  host.querySelector(".modal-backdrop").addEventListener("click", (e) => {
    if (e.target.classList.contains("modal-backdrop")) closeModal();
  });
  const confirmAdd = (payload) => {
    addSeries(payload);
    closeModal();
    libraryChanged();
    toast(`"${payload.title}" ajoute.`);
  };
  $("catalogSearch").addEventListener("input", (e) => {
    const results = searchCatalog(e.target.value);
    $("catalogResults").innerHTML = results.map((s) => `
      <button class="card catalog-hit" data-id="${esc(s.id)}">
        <div class="cover" style="${s.cover ? `background-image:url('${esc(s.cover)}')` : ""}">
          ${s.cover ? "" : `<span class="cover-fallback">${esc(s.name.slice(0, 2).toUpperCase())}</span>`}
        </div>
        <div class="card-body">
          <div class="card-title">${esc(s.name)}</div>
          <div class="card-meta">${s.total ? `${s.total} tomes` : "?"}</div>
        </div>
      </button>`).join("");
    $("catalogResults").querySelectorAll(".catalog-hit").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const hit = results.find((r) => r.id === id);
        confirmAdd({
          title: hit.name,
          publisher: "",
          total: hit.total || null,
          cover: hit.cover || "",
          catalogId: hit.id,
          tomes: catalogTomes(hit.id)
        });
      });
    });
  });
  $("addConfirm").addEventListener("click", () => {
    const title = $("addTitle").value.trim();
    if (!title) {
      toast("Le titre est obligatoire.");
      return;
    }
    const total = parseInt($("addTotal").value, 10);
    confirmAdd({
      title,
      author: $("addAuthor").value.trim(),
      publisher: $("addPublisher").value.trim(),
      total: Number.isFinite(total) && total > 0 ? total : null
    });
  });
}
$("addBtn").addEventListener("click", openAdd);
$("emptyAddBtn").addEventListener("click", openAdd);
onLibraryChanged(renderLibrary);

  <style rel="stylesheet" crossorigin>:root {
  --paper: #16150F;
  --card: #211F17;
  --ink: #EDEAE0;
  --dim: #A6A290;
  --border: #3A382C;
  --accent: #E0A93B;
  --accent-ink: #16150F;
  --owned: #6FAE6B;
  --gap: #D98A4A;
  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
}

.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 1rem;
}

.mast {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 0 1.25rem;
}

.mast h1 {
  margin: 0;
}

.kicker {
  opacity: 0.7;
  margin: 0.25rem 0 0;
}

.toolbar input {
  width: 100%;
  padding: 0.6rem;
  border-radius: 0.5rem;
  border: 1px solid #444;
  background: transparent;
  color: inherit;
}

.btn {
  border: none;
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 1rem;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--border);
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { background: #A6432F; color: #fff; }

.empty { text-align: center; padding: 48px 16px; color: var(--dim); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

.card {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  padding: 0;
  cursor: pointer;
  color: inherit;
}
.cover {
  aspect-ratio: 2/3;
  background: #2C2A1F;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cover-fallback { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.card-body { padding: 10px 12px; }
.card-title { font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
.card-meta { font-size: 0.8rem; color: var(--dim); margin-top: 4px; display: flex; gap: 6px; align-items: center; }

.badge { border-radius: 999px; padding: 2px 8px; font-size: 0.72rem; font-weight: 600; }
.badge.complete { background: #24361F; color: var(--owned); }
.badge.gap { background: #3A2917; color: var(--gap); }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-end; justify-content: center; z-index: 50;
}
.modal {
  background: var(--card); width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 20px; position: relative;
}
.modal .close { position: absolute; top: 10px; right: 14px; font-size: 1.6rem; background: none; border: none; cursor: pointer; color: var(--dim); }
.sheet-meta { display: flex; gap: 10px; color: var(--dim); font-size: 0.85rem; margin-bottom: 12px; }

.field { display: block; font-size: 0.85rem; color: var(--dim); margin: 12px 0; }
.field input, .field textarea {
  display: block; width: 100%; margin-top: 4px; padding: 10px; border-radius: 10px;
  border: 1px solid var(--border); font-size: 1rem; font-family: inherit;
  background: var(--paper); color: var(--ink);
}

.range-add { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
.range-add input { width: 70px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); }

.tome-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin: 14px 0; }
.tome {
  aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--paper);
  color: var(--ink); font-weight: 600; cursor: pointer; font-size: 0.95rem; min-height: 44px;
}
.tome.owned { background: var(--owned); color: #16150F; border-color: var(--owned); }

.sheet-actions { margin-top: 16px; display: flex; justify-content: flex-end; }

#catalogResults {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  margin: 4px 0 16px;
}
#catalogResults .card { min-height: unset; }
#catalogResults:empty { display: none; }

#manualDetails summary { color: var(--dim); font-size: 0.85rem; cursor: pointer; margin: 8px 0; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 0.9rem;
  z-index: 100;
}</style>
</head>

      <h1>BDkids</h1>
